<!DOCTYPE html>
<html lang="my" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manjomjai - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', 'Padauk', sans-serif; }
        .card-gradient {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.92));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
        <div class="card-gradient w-full max-w-md rounded-3xl p-8 shadow-2xl border border-slate-800 space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-block bg-amber-500/10 p-3 rounded-2xl text-amber-400 border border-amber-500/20">
                    <i class="fa-solid fa-lock text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold">Admin Login</h2>
                <p class="text-xs text-slate-400">Manjomjai Dashboard သို့ ဝင်ရန် စကားဝှက်ထည့်ပါ</p>
            </div>
            <div class="space-y-4">
                <div class="relative">
                    <input type="password" id="adminPassword" placeholder="Password ထည့်ရန်..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 pr-10">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-sm">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-amber-500 to-rose-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg shadow-rose-500/20 hover:opacity-95 transition-all">
                    လော့ဂ်အင်ဝင်မည်
                </button>
                <p id="loginError" class="text-rose-400 text-xs text-center hidden">စကားဝှက် မှားယွင်းနေပါသည်။</p>
            </div>
        </div>
    </div>

    <!-- ADMIN DASHBOARD (Hidden by default) -->
    <div id="adminDashboard" class="hidden max-w-6xl mx-auto px-4 py-8 space-y-8">
        <header class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-r from-amber-500 to-rose-500 p-2.5 rounded-xl">
                    <i class="fa-solid fa-gauge text-white text-lg"></i>
                </div>
                <h1 class="text-xl font-bold">Admin Management Panel</h1>
            </div>
            <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-rose-400 px-4 py-2 rounded-xl text-xs border border-slate-700 transition-all">
                <i class="fa-solid fa-right-from-bracket mr-1.5"></i> ထွက်မည်
            </button>
        </header>

        <!-- ADD CARD SECTION -->
        <section class="card-gradient rounded-2xl p-6 space-y-4 border border-slate-800">
            <h2 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-amber-400"></i> ပုံအသစ်ထည့်ရန် (Add Card)
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <input type="text" id="imageUrlInput" placeholder="ပုံ URL (သို့) Imgur/GitHub Image Link ထည့်ရန်..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <button onclick="addNewCard()" id="addBtn" class="bg-gradient-to-r from-amber-500 to-rose-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg hover:opacity-95 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> တင်မည် (Add)
                </button>
            </div>
            <p id="statusMsg" class="text-xs text-slate-400"></p>
        </section>

        <!-- EXISTING CARDS LIST -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-images text-amber-400"></i> တင်ပြီးသားပုံများ စာရင်း
                </h2>
                <span id="totalCardsCount" class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-400 border border-slate-700">0 ခု</span>
            </div>
            <div id="adminCardList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Loaded dynamically -->
            </div>
        </section>
    </div>

    <script>
        // GitHub Config
        const GITHUB_USERNAME = 'amtreactionofficial-eng';
        const GITHUB_REPO = 'stock-app';
        const GITHUB_BRANCH = 'main';
        const FILE_PATH = 'cards.json';
        
        // Token ထည့်သွင်းပြီးပါပြီ
        const GITHUB_TOKEN = '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'; 

        const ADMIN_PASS = '123456';

        // Password မျက်လုံးအဖွင့်အပိတ် လုပ်ဆောင်ချက်
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('adminPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function handleLogin() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_PASS) {
                localStorage.setItem('manjomjai_admin_logged', 'true');
                showDashboard();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handleLogout() {
            localStorage.removeItem('manjomjai_admin_logged');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            loadAdminCards();
        }

        // Auto login check
        window.onload = function() {
            if (localStorage.getItem('manjomjai_admin_logged') === 'true') {
                showDashboard();
            }
        };

        // GitHub ကနေ လက်ရှိ JSON ဖိုင်ကို ဆွဲထုတ်ခြင်း
        async function getGitHubFile() {
            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FILE_PATH}`;
            const res = await fetch(url, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });
            if (!res.ok) throw new Error('GitHub data fetch failed');
            return await res.json();
        }

        // Admin panel ထဲမှာ ပုံများပြသရန်
        async function loadAdminCards() {
            const listContainer = document.getElementById('adminCardList');
            listContainer.innerHTML = '<p class="text-xs text-slate-400 col-span-full text-center py-4">ဒေတာများကို ဆွဲထုတ်နေပါသည်...</p>';
            
            try {
                const fileData = await getGitHubFile();
                const contentDecoded = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
                let cards = Array.isArray(contentDecoded) ? contentDecoded : (contentDecoded.cards || []);
                
                document.getElementById('totalCardsCount').textContent = `${cards.length} ခု`;

                if (cards.length === 0) {
                    listContainer.innerHTML = '<p class="text-xs text-slate-500 col-span-full text-center py-8">ပုံမရှိသေးပါ။ ပုံအသစ်တင်ပါ။</p>';
                    return;
                }

                listContainer.innerHTML = cards.map((card, index) => `
                    <div class="card-gradient rounded-xl p-3 border border-slate-800 space-y-3">
                        <img src="${card.image || card.img}" class="w-full h-32 object-contain bg-slate-900 rounded-lg">
                        <div class="flex items-center justify-between text-[10px] text-slate-400">
                            <span>${new Date(card.createdAt).toLocaleDateString('my-MM')}</span>
                            <button onclick="deleteCard(${index})" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 px-3 py-1.5 rounded-lg border border-rose-500/20 transition-all">
                                <i class="fa-solid fa-trash mr-1"></i> ဖြတ်မည်
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                listContainer.innerHTML = `<p class="text-rose-400 text-xs col-span-full text-center">Error: ${err.message}</p>`;
            }
        }

        // ပုံအသစ်ထည့်ခြင်း
        async function addNewCard() {
            const urlInput = document.getElementById('imageUrlInput').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            if (!urlInput) {
                statusMsg.textContent = 'ကျေးဇူးပြု၍ ပုံ URL ထည့်ပါ။';
                statusMsg.className = 'text-xs text-rose-400';
                return;
            }

            statusMsg.textContent = 'GitHub သို့ တင်နေပါသည်...';
            statusMsg.className = 'text-xs text-amber-400';

            try {
                const fileData = await getGitHubFile();
                const contentDecoded = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
                let cards = Array.isArray(contentDecoded) ? contentDecoded : (contentDecoded.cards || []);

                const newCard = {
                    image: urlInput,
                    createdAt: new Date().toISOString()
                };
                cards.push(newCard);

                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(cards, null, 2))));
                const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Add new stock card',
                        content: updatedContent,
                        sha: fileData.sha,
                        branch: GITHUB_BRANCH
                    })
                });

                if (!updateRes.ok) throw new Error('Failed to update GitHub');

                statusMsg.textContent = '✅ အောင်မြင်စွာ တင်ပြီးပါပြီ။ User ဘက်တွင်လည်း ချက်ချင်းပေါ်ပါမည်။';
                statusMsg.className = 'text-xs text-emerald-400';
                document.getElementById('imageUrlInput').value = '';
                loadAdminCards();
            } catch (err) {
                statusMsg.textContent = `❌ အမှားအယွင်းရှိသည်: ${err.message}`;
                statusMsg.className = 'text-xs text-rose-400';
            }
        }

        // ပုံဖျက်ခြင်း
        async function deleteCard(index) {
            if (!confirm('ဤပုံကို ဖျတ်ရန် သေချာပါသလား?')) return;

            try {
                const fileData = await getGitHubFile();
                const contentDecoded = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
                let cards = Array.isArray(contentDecoded) ? contentDecoded : (contentDecoded.cards || []);

                cards.splice(index, 1);

                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(cards, null, 2))));
                const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Delete stock card',
                        content: updatedContent,
                        sha: fileData.sha,
                        branch: GITHUB_BRANCH
                    })
                });

                if (!updateRes.ok) throw new Error('Failed to delete from GitHub');

                alert('အောင်မြင်စွာ ဖျတ်ပြီးပါပြီ။ User ဘက်တွင်ပါ ပျောက်သွားပါမည်။');
                loadAdminCards();
            } catch (err) {
                alert(`ဖျတ်၍မရပါ: ${err.message}`);
            }
        }
    </script>
</body>
</html>
