<!DOCTYPE html>
<html lang="my" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manjomjai - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', 'Padauk', sans-serif; }
        .card-gradient {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.92));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
        <div class="card-gradient w-full max-w-md rounded-3xl p-8 shadow-2xl border border-slate-800 space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-block bg-amber-500/10 p-3 rounded-2xl text-amber-400 border border-amber-500/20">
                    <i class="fa-solid fa-lock text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold">Admin Login</h2>
                <p class="text-xs text-slate-400">Manjomjai Dashboard သို့ ဝင်ရန် အချက်အလက်ထည့်ပါ</p>
            </div>
            <div class="space-y-4">
                <div>
                    <input type="text" id="adminUser" placeholder="Username ထည့်ရန်..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div class="relative">
                    <input type="password" id="adminPassword" placeholder="Password ထည့်ရန်..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 pr-10">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-sm">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-amber-500 to-rose-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg shadow-rose-500/20 hover:opacity-95 transition-all">
                    လော့ဂ်အင်ဝင်မည်
                </button>
                <p id="loginError" class="text-rose-400 text-xs text-center hidden">Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။</p>
            </div>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboard" class="hidden max-w-6xl mx-auto px-4 py-8 space-y-8">
        <header class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-r from-amber-500 to-rose-500 p-2.5 rounded-xl">
                    <i class="fa-solid fa-gauge text-white text-lg"></i>
                </div>
                <h1 class="text-xl font-bold">Admin Management Panel</h1>
            </div>
            <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-rose-400 px-4 py-2 rounded-xl text-xs border border-slate-700 transition-all">
                <i class="fa-solid fa-right-from-bracket mr-1.5"></i> ထွက်မည်
            </button>
        </header>

        <!-- 1. GITHUB CONFIG SECTION -->
        <section class="card-gradient rounded-2xl p-6 space-y-4 border border-slate-800">
            <h2 class="text-base font-bold flex items-center gap-2 text-amber-400">
                <i class="fa-solid fa-gear"></i> GitHub Config (ပထမအကြိမ် ချိတ်ရန်)
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">GitHub Username</label>
                    <input type="text" id="cfgUser" value="amtreactionofficial-eng" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Repository Name</label>
                    <input type="text" id="cfgRepo" value="stock-app" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">GitHub Personal Token (PAT)</label>
                    <input type="password" id="cfgToken" placeholder="ghp_..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>
            <div>
                <button onclick="saveConfig()" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 px-4 py-2 rounded-xl text-xs border border-amber-500/30 transition-all font-medium">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Config သိမ်းမည်
                </button>
                <span id="configStatus" class="ml-3 text-xs text-emerald-400"></span>
            </div>
        </section>

        <!-- 2. THAI STOCK CARD UPLOAD SECTION -->
        <section class="card-gradient rounded-2xl p-6 space-y-4 border border-slate-800">
            <h2 class="text-base font-bold flex items-center gap-2 text-white">
                Thai Stock Card တင်ရန် (GitHub သို့)
            </h2>
            <div class="space-y-3">
                <label class="block text-xs text-slate-400">🖼️ ကတ်ပုံရွေးပါ</label>
                <input type="file" id="imageFileInput" accept="image/*" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-white hover:file:bg-amber-600 focus:outline-none">
            </div>
            <button onclick="addNewCard()" class="w-full bg-gradient-to-r from-amber-500 to-rose-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg hover:opacity-95 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> GitHub သို့ တင်မည်
            </button>
            <p id="statusMsg" class="text-xs text-slate-400"></p>
        </section>

        <!-- 3. EXISTING CARDS LIST -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-white">တင်ထားပြီးသော ကတ်များ</h2>
                <span id="totalCardsCount" class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-400 border border-slate-700">0 ခု</span>
            </div>
            <div id="adminCardList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Loaded dynamically -->
            </div>
        </section>
    </div>

    <script>
        const ADMIN_USER = 'aungminthu';
        const ADMIN_PASS = '@@aungminthu';

        // Load saved config on startup
        window.onload = function() {
            if (localStorage.getItem('manjomjai_admin_logged') === 'true') {
                showDashboard();
            }
            const savedUser = localStorage.getItem('gh_user');
            const savedRepo = localStorage.getItem('gh_repo');
            const savedToken = localStorage.getItem('gh_token');

            if (savedUser) document.getElementById('cfgUser').value = savedUser;
            if (savedRepo) document.getElementById('cfgRepo').value = savedRepo;
            if (savedToken) document.getElementById('cfgToken').value = savedToken;
        };

        function saveConfig() {
            const user = document.getElementById('cfgUser').value.trim();
            const repo = document.getElementById('cfgRepo').value.trim();
            const token = document.getElementById('cfgToken').value.trim();

            localStorage.setItem('gh_user', user);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            document.getElementById('configStatus').textContent = '✅ Config သိမ်းပြီးပါပြီ!';
            setTimeout(() => { document.getElementById('configStatus').textContent = ''; }, 3000);
            loadAdminCards();
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('adminPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function handleLogin() {
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPassword').value;
            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                localStorage.setItem('manjomjai_admin_logged', 'true');
                showDashboard();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handleLogout() {
            localStorage.removeItem('manjomjai_admin_logged');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            loadAdminCards();
        }

        function getConfig() {
            return {
                username: document.getElementById('cfgUser').value.trim() || 'amtreactionofficial-eng',
                repo: document.getElementById('cfgRepo').value.trim() || 'stock-app',
                token: document.getElementById('cfgToken').value.trim(),
                branch: 'main',
                path: 'cards.json'
            };
        }

        async function getGitHubFile() {
            const cfg = getConfig();
            const url = `https://api.github.com/repos/${cfg.username}/${cfg.repo}/contents/${cfg.path}?ref=${cfg.branch}`;
            const res = await fetch(url, {
                headers: { 
                    'Authorization': `token ${cfg.token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.message || 'GitHub data fetch failed');
            }
            return await res.json();
        }

        async function loadAdminCards() {
            const listContainer = document.getElementById('adminCardList');
            listContainer.innerHTML = '<p class="text-xs text-slate-400 col-span-full text-center py-4">ဒေတာများကို ဆွဲထုတ်နေပါသည်...</p>';
            
            try {
                const fileData = await getGitHubFile();
                let cards = [];
                if (fileData.content) {
                    const contentDecoded = JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\s/g, '')))));
                    cards = Array.isArray(contentDecoded) ? contentDecoded : (contentDecoded.cards || []);
                }
                
                document.getElementById('totalCardsCount').textContent = `${cards.length} ခု`;

                if (cards.length === 0) {
                    listContainer.innerHTML = '<p class="text-xs text-slate-500 col-span-full text-center py-8">ပုံမရှိသေးပါ။</p>';
                    return;
                }

                listContainer.innerHTML = cards.map((card, index) => `
                    <div class="card-gradient rounded-xl p-3 border border-slate-800 space-y-3">
                        <img src="${card.image || card.img}" class="w-full h-32 object-contain bg-slate-900 rounded-lg">
                        <div class="flex items-center justify-between text-[10px] text-slate-400">
                            <span>${card.createdAt ? new Date(card.createdAt).toLocaleDateString('my-MM') : ''}</span>
                            <button onclick="deleteCard(${index})" class="bg-rose-500/15 hover:bg-rose-500/30 text-rose-400 px-3 py-1.5 rounded-lg border border-rose-500/30 transition-all font-medium">
                                <i class="fa-solid fa-trash mr-1"></i> ဖြတ်မည်
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                listContainer.innerHTML = `<p class="text-rose-400 text-xs col-span-full text-center">Error: ${err.message}</p>`;
            }
        }

        function addNewCard() {
            const fileInput = document.getElementById('imageFileInput');
            const statusMsg = document.getElementById('statusMsg');
            const cfg = getConfig();

            if (!cfg.token) {
                statusMsg.textContent = '❌ ကျေးဇူးပြု၍ GitHub Personal Token (PAT) ထည့်ပါ။';
                statusMsg.className = 'text-xs text-rose-400';
                return;
            }
            
            if (fileInput.files.length === 0) {
                statusMsg.textContent = '❌ ကျေးဇူးပြု၍ တင်မည့်ပုံကို ရွေးချယ်ပါ။';
                statusMsg.className = 'text-xs text-rose-400';
                return;
            }

            const file = fileInput.files[0];
            statusMsg.textContent = 'ပုံကို ဖတ်နေပါသည်...';
            statusMsg.className = 'text-xs text-amber-400';

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Image = e.target.result;

                try {
                    statusMsg.textContent = 'GitHub သို့ ပုံနှင့်ဒေတာများ တင်နေပါသည်...';
                    
                    const fileData = await getGitHubFile();
                    let cards = [];
                    if (fileData.content) {
                        const contentDecoded = JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\s/g, '')))));
                        cards = Array.isArray(contentDecoded) ? contentDecoded : (contentDecoded.cards || []);
                    }

                    const newCard = {
                        image: base64Image,
                        createdAt: new Date().toISOString()
                    };
                    cards.push(newCard);

                    const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(cards, null, 2))));
                    const updateRes = await fetch(`https://api.github.com/repos/${cfg.username}/${cfg.repo}/contents/${cfg.path}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${cfg.token}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github.v3+json'
                        },
                        body: JSON.stringify({
                            message: 'Add new Thai stock card via admin',
                            content: updatedContent,
                            sha: fileData.sha,
                            branch: cfg.branch
                        })
                    });

                    if (!updateRes.ok) {
                        const errRes = await updateRes.json().catch(() => ({}));
                        throw new Error(errRes.message || 'GitHub သို့ တင်၍မရပါ။');
                    }

                    statusMsg.textContent = '✅ အောင်မြင်စွာ တင်ပြီးပြီဖြစ်ပါသည်!';
                    statusMsg.className = 'text-xs text-emerald-400';
                    fileInput.value = '';
                    loadAdminCards();
                } catch (err) {
                    statusMsg.textContent = `❌ အမှားအယွင်းရှိသည်: ${err.message}`;
                    statusMsg.className = 'text-xs text-rose-400';
                }
            };
            reader.readAsDataURL(file);
        }

        async function deleteCard(index) {
            if (!confirm('ဤကတ်ပုံကို ဖြတ်ရန် သေချာပါသလား?')) return;

            const cfg = getConfig();
            try {
                const fileData = await getGitHubFile();
                let cards = [];
                if (fileData.content) {
                    const contentDecoded = JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\s/g, '')))));
                    cards = Array.isArray(contentDecoded) ? contentDecoded : (contentDecoded.cards || []);
                }

                cards.splice(index, 1);

                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(cards, null, 2))));
                const updateRes = await fetch(`https://api.github.com/repos/${cfg.username}/${cfg.repo}/contents/${cfg.path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${cfg.token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: 'Delete Thai stock card via admin',
                        content: updatedContent,
                        sha: fileData.sha,
                        branch: cfg.branch
                    })
                });

                if (!updateRes.ok) {
                    const errRes = await updateRes.json().catch(() => ({}));
                    throw new Error(errRes.message || 'GitHub မှ ဖြတ်၍မရပါ။');
                }

                alert('အောင်မြင်စွာ ဖြတ်ပြီးပါပြီ။');
                loadAdminCards();
            } catch (err) {
                alert(`ဖြတ်၍မရပါ: ${err.message}`);
            }
        }
    </script>
</body>
</html>
