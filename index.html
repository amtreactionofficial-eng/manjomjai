<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Manjomjai Stock Predictions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', 'Padauk', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
        }
        .card-image-container {
            width: 100%;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 250px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card-image-container img {
            max-width: 100%;
            max-height: 800px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
        /* Ticker Animation */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 10px 0;
            white-space: nowrap;
        }
        .ticker {
            display: inline-block;
            animation: ticker 30s linear infinite;
        }
        .ticker-item {
            display: inline-flex;
            align-items: center;
            padding: 0 2rem;
            font-size: 0.85rem;
            font-weight: 600;
        }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }
    </style>
</head>
<body>

    <!-- REAL-TIME STOCK TICKER BAR -->
    <div class="ticker-wrap">
        <div class="ticker" id="stockTicker">
            <span class="ticker-item text-slate-400">🌍 Live Global Markets Loading...</span>
        </div>
    </div>

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-xl border-b border-slate-800/50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="text-xl font-black text-amber-400 tracking-wider">MANJOMJAI</span>
            <div class="flex items-center space-x-2 text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-full border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Live Update</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8 space-y-6">
        <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">Thai Stock Predictions & Cards</h1>
            <p class="text-slate-400 text-sm">နေ့စဉ် ထိုင်းစတော့ခ် ခန့်မှန်းချက် ကဒ်ပြားများ</p>
        </div>

        <!-- CARDS FEED -->
        <div id="publicCardHistory" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="glass-card p-6 text-center text-slate-500 col-span-full">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p>ကဒ်များကို ရှာဖွေနေပါသည်...</p>
            </div>
        </div>
    </main>

    <script>
        // GitHub Config (amtreactionofficial-eng / stock-app)
        const GH_USER = 'amtreactionofficial-eng';
        const GH_REPO = 'stock-app';

        // Fetch Global Stock Market Data (Mock Live Ticker for major indices)
        function loadMarketTicker() {
            const markets = [
                { name: 'SET (Thailand)', val: '1,348.20', change: '+0.45%', up: true },
                { name: 'S&P 500', val: '5,648.40', change: '+0.82%', up: true },
                { name: 'NASDAQ', val: '17,855.10', change: '+1.12%', up: true },
                { name: 'FTSE 100', val: '8,280.50', change: '-0.15%', up: false },
                { name: 'NIKKEI 225', val: '38,700.30', change: '+0.64%', up: true },
                { name: 'HANG SENG', val: '17,650.80', change: '-0.38%', up: false }
            ];

            const tickerContent = markets.concat(markets).map(m => `
                <span class="ticker-item">
                    <span class="text-slate-300 mr-2">${m.name}</span>
                    <span class="text-white mr-2">${m.val}</span>
                    <span class="${m.up ? 'text-emerald-400' : 'text-rose-400'}">
                        <i class="fa-solid fa-arrow-${m.up ? 'up' : 'down'} mr-1"></i>${m.change}
                    </span>
                </span>
            `).join('');

            document.getElementById('stockTicker').innerHTML = tickerContent;
        }

        // Fetch Cards from GitHub Repository
        async function loadPublicCards() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/cards.json`);
                if(res.ok) {
                    const data = await res.json();
                    const content = JSON.parse(atob(data.content));
                    renderPublicCards(content.cards || []);
                } else {
                    document.getElementById('publicCardHistory').innerHTML = '<div class="glass-card p-6 text-center text-slate-500 col-span-full">ယခုလောလောဆယ် တင်ထားသော ကဒ်မရှိသေးပါ။</div>';
                }
            } catch(e) {
                document.getElementById('publicCardHistory').innerHTML = '<div class="glass-card p-6 text-center text-slate-500 col-span-full">ချိတ်ဆက်မှု အခက်အခဲ ရှိနေပါသည်။</div>';
            }
        }

        function renderPublicCards(cards) {
            const container = document.getElementById('publicCardHistory');
            if(cards.length === 0) {
                container.innerHTML = '<div class="glass-card p-6 text-center text-slate-500 col-span-full">ယခုလောလောဆယ် တင်ထားသော ကဒ်မရှိသေးပါ။</div>';
                return;
            }
            container.innerHTML = cards.map(c => `
                <div class="glass-card p-4 space-y-3">
                    <div class="card-image-container">
                        <img src="${c.image}" alt="Stock Prediction Card" loading="lazy">
                    </div>
                    <div class="flex items-center justify-between text-xs text-slate-400 px-1">
                        <span><i class="fa-regular fa-calendar mr-1"></i>${new Date(c.createdAt).toLocaleDateString()}</span>
                        <span class="text-amber-400 font-medium">Manjomjai Official</span>
                    </div>
                </div>
            `).join('');
        }

        // Initialize
        loadMarketTicker();
        loadPublicCards();
    </script>
</body>
</html>
