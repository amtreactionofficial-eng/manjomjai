<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Man Jom Jai - Thai Stock Card</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        lightBg: '#f8fafc',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Pyidaungsu:wght@400;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', 'Inter', 'Pyidaungsu', sans-serif; }
        /* Stock Card Ratio Container (e.g., 4:3 or 16:9 suitable for cards) */
        .card-ratio {
            aspect-ratio: 4 / 5;
            object-fit: cover;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-lightBg dark:bg-darkBg text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <!-- Header Section -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <!-- Logo Image Support -->
                <img src="logo.png" alt="Logo" class="w-10 h-10 rounded-full border border-emerald-500 object-cover" onerror="this.src='https://via.placeholder.com/40'">
                <span class="text-xl font-black bg-gradient-to-r from-emerald-500 to-cyan-500 bg-clip-text text-transparent">manjomjai.site</span>
            </div>
            
            <div class="flex items-center space-x-4">
                <select id="langSwitch" onchange="changeLanguage(this.value)" class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-emerald-500 cursor-pointer">
                    <option value="th">🇹🇭 ไทย</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="my">🇲🇲 မြန်မာ</option>
                </select>

                <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:text-emerald-500 transition">
                    <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <!-- Hero Section -->
        <div class="text-center mb-10">
            <h1 id="txtTitle" class="text-3xl md:text-5xl font-bold mb-3">ใบหุ้นไทยรายวัน (Thai Stock Cards)</h1>
            <p id="txtSub" class="text-slate-600 dark:text-slate-400 text-sm md:text-base">รวมใบหุ้นไทยที่แม่นยำและวิเคราะห์ข้อมูลทุกวันอย่างมืออาชีพ</p>
        </div>

        <!-- Today's Featured Stock Card Section -->
        <section class="mb-12">
            <div class="flex justify-between items-center mb-6">
                <h2 id="txtTodayTitle" class="text-xl font-bold flex items-center gap-2">🔥 ယနေ့ခေတ်စားနေသော စတော့ခ်ကတ် (Today's Card)</h2>
                <span id="currentDateDisplay" class="text-sm font-semibold text-emerald-500 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/25"></span>
            </div>
            
            <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 md:p-6 shadow-xl max-w-2xl mx-auto">
                <div class="flex justify-between items-center mb-4">
                    <span class="bg-emerald-500 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">LIVE</span>
                    <span id="cardDate1" class="text-xs text-slate-500 dark:text-slate-400"></span>
                </div>
                <!-- Card Image with Perfect Ratio -->
                <div class="w-full bg-slate-100 dark:bg-slate-900 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 flex items-center justify-center">
                    <!-- Change src to your actual image path when uploading -->
                    <img src="stock-today.jpg" alt="Today Stock Card" class="card-ratio w-full object-cover" onerror="this.src='https://via.placeholder.com/600x750?text=Upload+Stock+Card+Image'">
                </div>
            </div>
        </section>

        <!-- History Section -->
        <section>
            <h2 id="txtHistoryTitle" class="text-xl font-bold mb-6 border-b border-slate-200 dark:border-slate-800 pb-3">📅 ယခင်ရက်စွဲအလိုက် မှတ်တမ်းများ (History)</h2>
            <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- History Item 1 -->
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 shadow-lg">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-semibold text-slate-400 bg-slate-100 dark:bg-slate-700 px-2.5 py-1 rounded">History</span>
                        <span class="history-date text-xs text-slate-500 dark:text-slate-400">Sep 5, 2026</span>
                    </div>
                    <div class="w-full bg-slate-100 dark:bg-slate-900 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800">
                        <img src="history-1.jpg" alt="History Card" class="card-ratio w-full object-cover" onerror="this.src='https://via.placeholder.com/400x500?text=History+Card+02'">
                    </div>
                </div>

                <!-- History Item 2 -->
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 shadow-lg">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-semibold text-slate-400 bg-slate-100 dark:bg-slate-700 px-2.5 py-1 rounded">History</span>
                        <span class="history-date text-xs text-slate-500 dark:text-slate-400">Sep 4, 2026</span>
                    </div>
                    <div class="w-full bg-slate-100 dark:bg-slate-900 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800">
                        <img src="history-2.jpg" alt="History Card" class="card-ratio w-full object-cover" onerror="this.src='https://via.placeholder.com/400x500?text=History+Card+03'">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 manjomjai.site. All rights reserved.</p>
    </footer>

    <!-- JavaScript Support -->
    <script>
        // Automatic Dynamic Date Display
        const options = { year: 'numeric', month: 'short', day: 'numeric' };
        const todayStr = new Date().toLocaleDateString('en-US', options);
        document.getElementById('currentDateDisplay').innerText = todayStr;
        document.getElementById('cardDate1').innerText = todayStr;

        // Translations
        const translations = {
            th: {
                title: "ใบหุ้นไทยรายวัน (Thai Stock Cards)",
                subtitle: "รวมใบหุ้นไทยที่แม่นยำและวิเคราะห์ข้อมูลทุกวันอย่างมืออาชีพ",
                todayTitle: "🔥 หุ้นเด่นประจำวันนี้ (Today's Card)",
                historyTitle: "📅 ประวัติย้อนหลัง (History)"
            },
            en: {
                title: "Daily Thai Stock Cards",
                subtitle: "Accurate Thai stock cards and professional daily analysis.",
                todayTitle: "🔥 Today's Featured Card",
                historyTitle: "📅 Stock Cards History"
            },
            my: {
                title: "ထိုင်းစတော့ခ်ကတ် နေ့စဉ်အချက်အလက်များ",
                subtitle: "တိကျမှန်ကန်သော ထိုင်းစတော့ခ်ကတ်များနှင့် ကျွမ်းကျင်သူများ၏ နေ့စဉ်သုံးသပ်ချက်များ",
                todayTitle: "🔥 ယနေ့ခေတ်စားနေသော စတော့ခ်ကတ်",
                historyTitle: "📅 ယခင်ရက်စွဲအလိုက် မှတ်တမ်းများ (History)"
            }
        };

        function changeLanguage(lang) {
            document.getElementById('txtTitle').innerText = translations[lang].title;
            document.getElementById('txtSub').innerText = translations[lang].subtitle;
            document.getElementById('txtTodayTitle').innerText = translations[lang].todayTitle;
            document.getElementById('txtHistoryTitle').innerText = translations[lang].historyTitle;
            localStorage.setItem('selectedLang', lang);
        }

        const themeIcon = document.getElementById('themeIcon');
        function updateThemeIcon() {
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m3.343-5.657l-.707-.707m12.728 12.728l-.707-.707M6.343 17.657l-.707.707M16.95 7.05l-.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>';
            } else {
                themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>';
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.500classnames || document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeIcon();
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('selectedLang') || 'th';
            document.getElementById('langSwitch').value = savedLang;
            changeLanguage(savedLang);

            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
            updateThemeIcon();
        };
    </script>
</body>
</html>
