<!DOCTYPE html>
<html lang="my" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Manjomjai - Stock Predictions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Same styles as before... (ငါ့ရဲ့ ယခင်ကုဒ်အတိုင်း) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', 'Padauk', sans-serif; }
        /* ... (styles အကုန်လုံးက ယခင်အတိုင်း) ... */
    </style>
</head>
<body class="dark bg-slate-950 text-slate-100 min-h-screen transition-colors duration-300" id="bodyTheme">

    <!-- TOP NAVIGATION BAR (ယခင်အတိုင်း) -->
    <header class="sticky top-0 z-50 nav-blur bg-slate-900/80 border-b border-slate-800/50 transition-colors duration-300">
        <!-- ... -->
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10 space-y-8 sm:space-y-12">

        <!-- HERO SECTION (ယခင်အတိုင်း) -->
        <section class="relative rounded-2xl sm:rounded-3xl overflow-hidden hero-gradient border border-slate-800/50 p-5 sm:p-10 shadow-2xl transition-colors duration-300">
            <!-- ... -->
        </section>

        <!-- CARDS SECTION -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-1 h-8 bg-gradient-to-b from-amber-500 to-rose-500 rounded-full"></div>
                    <h2 class="text-xl sm:text-2xl font-bold">📊 Thai Stock Cards</h2>
                </div>
                <span id="cardCount" class="text-xs text-slate-400 bg-slate-800/50 px-3 py-1 rounded-full border border-slate-700/30">
                    0 ကဒ်
                </span>
            </div>

            <div class="relative">
                <div id="cardContainer" class="flex gap-4 overflow-x-auto pb-4 snap-x snap-mandatory scroll-smooth">
                    <div id="loadingCards" class="flex items-center justify-center w-full py-8">
                        <span class="loading-spinner-sm mr-2"></span>
                        <span class="text-slate-400 text-sm">ကဒ်များကို ယူနေပါသည်...</span>
                    </div>
                </div>

                <button onclick="scrollCards('left')" class="absolute left-0 top-1/2 -translate-y-1/2 bg-slate-800/80 backdrop-blur-sm text-white p-2 rounded-full border border-slate-700/50 hover:bg-slate-700 transition-all hidden md:flex items-center justify-center w-8 h-8 z-10">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button onclick="scrollCards('right')" class="absolute right-0 top-1/2 -translate-y-1/2 bg-slate-800/80 backdrop-blur-sm text-white p-2 rounded-full border border-slate-700/50 hover:bg-slate-700 transition-all hidden md:flex items-center justify-center w-8 h-8 z-10">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>

            <div id="emptyCards" class="text-center py-8 text-slate-500 card-gradient rounded-2xl p-8 hidden">
                <i class="fa-solid fa-images text-3xl mb-3 block opacity-30"></i>
                <p>ကဒ်မရှိသေးပါ။ မကြာခင်လာပါမည်။</p>
            </div>
        </section>

        <!-- MARKET INSIGHTS SECTION (ယခင်အတိုင်း) -->
        <!-- ... -->

    </main>

    <!-- FOOTER (ယခင်အတိုင်း) -->
    <!-- ... -->

    <script>
        // ============================================================
        // TRANSLATIONS (ယခင်အတိုင်း)
        // ============================================================
        // ... (translations အကုန်လုံး)

        // ============================================================
        // LANGUAGE, THEME, MODAL (ယခင်အတိုင်း)
        // ============================================================
        // ... 

        // ============================================================
        // CARDS - JSONBin Cloud (API Key အသစ်)
        // ============================================================
        const JSONBIN_API_KEY = '$2a$10$4uUGngsWb2sP598etWyRrO9ijJlYBh.zqRwf.wactawO92RT7o3W2';
        const JSONBIN_BIN_ID = '6a9d7740da38895dfe4004a0';

        async function fetchCardsFromCloud() {
            try {
                console.log('📥 Fetching from JSONBin...');
                console.log('🔑 API Key:', JSONBIN_API_KEY.substring(0, 20) + '...');
                console.log('📦 Bin ID:', JSONBIN_BIN_ID);
                
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    headers: { 
                        'X-Master-Key': JSONBIN_API_KEY,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('📊 Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Error response:', errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                console.log('✅ Fetched data:', data);
                
                return data.record?.cards || [];
            } catch (error) {
                console.error('❌ Cloud fetch error:', error);
                return [];
            }
        }

        async function renderCards() {
            const container = document.getElementById('cardContainer');
            const loading = document.getElementById('loadingCards');
            const empty = document.getElementById('emptyCards');
            const count = document.getElementById('cardCount');

            try {
                const cards = await fetchCardsFromCloud();
                loading.style.display = 'none';

                count.textContent = `${cards.length} ကဒ်`;

                if (cards.length === 0) {
                    container.innerHTML = '';
                    empty.style.display = 'block';
                    return;
                }
                empty.style.display = 'none';

                container.innerHTML = cards.map(card => `
                    <div class="card-item snap-start">
                        <div class="bg-slate-800/40 dark:bg-slate-800/40 rounded-2xl overflow-hidden border border-slate-700/30 hover:border-amber-500/30 transition-all duration-300 h-full">
                            <div class="relative">
                                <img src="${card.image}" alt="Stock Card" 
                                     class="w-full h-auto object-contain bg-slate-900"
                                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22338%22%3E%3Crect fill=%22%231e293b%22 width=%22600%22 height=%22338%22/%3E%3Ctext x=%22300%22 y=%22169%22 text-anchor=%22middle%22 fill=%22%2364748b%22 font-size=%2220%22 font-family=%22sans-serif%22%3ENo Image%3C/text%3E%3C/svg%3E'">
                                <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-sm px-2.5 py-1 rounded-lg text-[9px] text-amber-400 border border-amber-500/20">
                                    <i class="fa-solid fa-qrcode mr-1"></i> SCAN ME
                                </div>
                            </div>
                            <div class="p-3">
                                <div class="flex items-center justify-between">
                                    <span class="text-[10px] text-slate-400">
                                        <i class="fa-regular fa-calendar mr-1"></i> ${new Date(card.createdAt).toLocaleDateString('my-MM', { day: '2-digit', month: '2-digit', year: 'numeric' })}
                                    </span>
                                    <span class="text-[9px] text-slate-500">
                                        <i class="fa-regular fa-clock mr-1"></i> ${new Date(card.createdAt).toLocaleTimeString('my-MM', { hour: '2-digit', minute: '2-digit' })}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                loading.innerHTML = `<span class="text-rose-400 text-sm">❌ ကဒ်များကို ယူ၍မရပါ။ Error: ${error.message}</span>`;
            }
        }

        // ============================================================
        // SCROLL CARDS
        // ============================================================
        function scrollCards(direction) {
            const container = document.getElementById('cardContainer');
            const firstCard = container.querySelector('.card-item');
            if (!firstCard) return;
            const scrollAmount = firstCard.offsetWidth + 16;
            if (direction === 'left') {
                container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            } else {
                container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            // Language, Theme (ယခင်အတိုင်း)
            // ...

            console.log('✅ Manjomjai initialized!');
            console.log('☁️ JSONBin Bin ID:', JSONBIN_BIN_ID);
            console.log('🔑 API Key:', JSONBIN_API_KEY.substring(0, 20) + '...');
            
            renderCards();
            setInterval(renderCards, 15000);
        }

        window.onload = init;
    </script>

</body>
</html>
